# golangci-lint configuration. Kept intentionally close to defaults:
# the linters below catch real defect classes without style bikeshedding.
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck      # unchecked errors
    - govet         # go vet
    - staticcheck   # correctness, simplification, style (includes gosimple/stylecheck)
    - unused        # unused code
    - ineffassign
    - misspell
    - copyloopvar   # accidental loop-variable capture
    - bodyclose     # unclosed HTTP response bodies
    - noctx         # HTTP requests without context
    - gosec         # security-sensitive checks (G-ids)

  settings:
    gosec:
      excludes:
        # G304: file inclusion via variable path — the config/engine paths come
        # from validated admin configuration, not user input. Reviewed per-site.
        - G304

  exclusions:
    # Tests legitimately use math/rand-free patterns, fmt errors, etc.
    rules:
      - path: _test\.go
        linters:
          - gosec
